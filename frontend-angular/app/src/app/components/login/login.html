<div class="login-screen">
  <div class="login-overlay"></div>

  <section class="login-card" aria-label="Autenticacion de acceso">
    <p class="login-kicker">ACCESO AL SISTEMA</p>
    <h1 class="login-title">Autenticación</h1>
    <p class="login-subtitle">Inicia sesión para acceder a Revisar Fichas</p>

    <form (ngSubmit)="login()" class="login-form">
      <label for="username" class="login-label">Usuario</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Usuario"
        class="login-input"
        required
      />

      <label for="password" class="login-label">Contraseña</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        placeholder="Contraseña"
        class="login-input"
        required
      />

      <div class="login-error" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="login-button" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>
  </section>
</div>
