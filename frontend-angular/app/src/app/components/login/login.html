<div class="login-screen">
  <div class="login-overlay"></div>

  <section class="login-card bed-card" aria-label="Monitor de cama">
    <div class="bed-copy">
      <p class="login-kicker">MONITOREO DE CAMA</p>
      <h1 class="login-title">Estado en tiempo real</h1>
      <p class="login-subtitle">Indicador listo para mostrar si llega un 1 o un 0 desde el dispositivo.</p>
    </div>

    <div class="bed-layout">
      <div class="bed-illustration" [class.is-occupied]="signalValue === 1" aria-hidden="true">
        <div class="bed-headboard"></div>
        <div class="bed-frame"></div>
        <div class="bed-pillow"></div>
        <div class="bed-mattress"></div>
        <div class="bed-blanket"></div>
        <div class="bed-leg bed-leg-left"></div>
        <div class="bed-leg bed-leg-right"></div>
      </div>

      <div class="signal-panel">
        <div class="signal-badge" [class.is-on]="signalValue === 1" [class.is-off]="signalValue === 0">
          <span class="signal-dot"></span>
          {{ signalLabel }}
        </div>

        <div class="signal-value">{{ signalValue }}</div>
        <div class="signal-state">{{ occupancyLabel }}</div>
        <p class="signal-note">{{ lastReading }}</p>
      </div>
    </div>
  </section>
</div>
