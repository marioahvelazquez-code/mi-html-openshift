services:
  backend:
    build: ../backend
    volumes:
      - ../backend:/app
    expose:
      - "8000"
    env_file:
      - ../.env

  frontend:
    image: node:20-alpine
    container_name: react_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5184"
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5184:5184"
    depends_on:
      - backend
