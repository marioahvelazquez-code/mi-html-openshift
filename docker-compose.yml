services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - ./frontend/src/assets:/shared-assets
    expose:
      - "8000"
    ports:
      - "8012:8000"
    env_file:
      - .env

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "8092:80"
    depends_on:
      - backend
