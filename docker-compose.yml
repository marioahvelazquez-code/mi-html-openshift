services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    expose:
      - "8000"
    env_file:
      - .env

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    volumes:
      - ./frontend/src/assets/Fichas_estatales:/usr/share/nginx/html/fichas:ro
    ports:
      - "8094:80"
    depends_on:
      - backend
