server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    etag off;

    # Servir archivos estáticos de fichas sin reescribir a index.html
    location /fichas/ {
        alias /usr/share/nginx/html/fichas/;
        expires 1h;
    }

    # Mario: Rutas públicas para fichas estatales y nacionales
    location /public/fichas/ {
        alias /usr/share/nginx/html/fichas/;
        expires 1h;
    }

    location /public/nacional/ {
        alias /usr/share/nginx/html/nacional/;
        expires 1h;
    }

    location /public/oficios/ {
        alias /usr/share/nginx/html/oficios/;
        expires 1h;
    }

    # Mario: fuerza MIME type correcto para módulos JS (.mjs) necesario para pdf.worker
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Mario: evita cache del index para no reutilizar MIME viejo en navegadores
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location /api/ {
        proxy_pass http://backend:8100;
        proxy_http_version 1.1;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Mario: sirve fichas hospitalarias generadas desde el volumen compartido.
    location /media/ {
        alias /app/ficha/output_fichas/;
        try_files $uri =404;
        expires 1h;
    }
}

