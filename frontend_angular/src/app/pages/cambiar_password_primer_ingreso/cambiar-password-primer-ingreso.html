<main class="login-screen">
  <div class="login-overlay"></div>

  <section class="login-card" aria-label="Cambio de contrasena por primer ingreso">
    <div class="login-brand">
      <img src="/img/logo-gob-mx.png" class="login-logo-gob" alt="Gobierno de Mexico" />
      <div class="login-divider"></div>
      <img src="/img/dpti.png" class="login-logo-dpti" alt="DPTI" />
    </div>

    <p class="login-kicker">Primer ingreso</p>
    <h1 class="login-title">Actualiza tu contrasena</h1>
    <p class="login-subtitle">
      Por seguridad, en tu primer acceso debes modificar tu contrasena antes de continuar.
    </p>

    <form (ngSubmit)="guardarYContinuar()" class="login-form">
      <label for="nuevaContrasena" class="login-label">Nueva contrasena</label>
      <input
        id="nuevaContrasena"
        name="nuevaContrasena"
        type="password"
        class="login-input"
        [(ngModel)]="nuevaContrasena"
        autocomplete="new-password"
      />

      <label for="confirmarContrasena" class="login-label">Confirmar contrasena</label>
      <input
        id="confirmarContrasena"
        name="confirmarContrasena"
        type="password"
        class="login-input"
        [(ngModel)]="confirmarContrasena"
        autocomplete="new-password"
      />

      @if (error) {
        <p class="login-error">{{ error }}</p>
      }

      <button type="submit" class="login-button" [disabled]="cargando">
        {{ cargando ? 'Actualizando...' : 'Guardar y continuar' }}
      </button>

      <button type="button" class="login-button login-button-secondary" (click)="volverAInicioSesion()">
        Volver a inicio de sesion
      </button>
    </form>
  </section>
</main>
