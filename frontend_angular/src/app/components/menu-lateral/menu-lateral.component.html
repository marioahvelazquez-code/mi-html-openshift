<div class="menu-backdrop" [class.visible]="abierto" (click)="cerrarMenu()"></div>

<aside class="menu-panel" [class.abierto]="abierto" aria-label="Menu lateral">
  <div class="menu-content">
    <div class="menu-header">
      <img src="/img/dpti.png" alt="DPTI" class="logo-dpti" />
      <button type="button" class="btn-cerrar" (click)="cerrarMenu()" aria-label="Cerrar menu">
        ×
      </button>
    </div>

    <hr class="menu-divider" />

    <ul class="menu-items" role="menu">
      <li>
        <button type="button" class="menu-item" (click)="irA('/home')" role="menuitem">
          <span class="menu-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M3 10.5 12 3l9 7.5" />
              <path d="M5.5 9.5V21h13V9.5" />
            </svg>
          </span>
          <span>Inicio</span>
        </button>
      </li>
      <li>
        <button type="button" class="menu-item" (click)="irA('/revisar-ficha')" role="menuitem">
          <span class="menu-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="3" y="3" width="8" height="8" />
              <rect x="13" y="3" width="8" height="8" />
              <rect x="3" y="13" width="8" height="8" />
              <rect x="13" y="13" width="8" height="8" />
            </svg>
          </span>
          <span>Revisar fichas</span>
        </button>
      </li>
      <!-- Opción de carga excel eliminada -->
      <li>
        <button type="button" class="menu-item" (click)="irA('/login')" role="menuitem">
          <span class="menu-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M14 4h6v16h-6" />
              <path d="M10 12h10" />
              <path d="m7 9-3 3 3 3" />
            </svg>
          </span>
          <span>Salir de sesion</span>
        </button>
      </li>
    </ul>

    <div class="menu-footer">
      <span class="social-icon" aria-hidden="true">f</span>
      <span class="social-icon" aria-hidden="true">x</span>
      <span class="social-icon" aria-hidden="true">i</span>
      <span class="social-icon" aria-hidden="true">y</span>
    </div>
  </div>
</aside>
